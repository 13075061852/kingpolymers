<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>kingpolymer · UI 升级设计</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Microsoft YaHei', system-ui, sans-serif;
      background: #f3f6f8;
      color: #123f63;
    }
    header {
      padding: 36px 5vw;
      background: white;
      border-bottom: 1px solid #dbe4e9;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 12px;
    }
    p {
      color: #607486;
      line-height: 1.7;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    a {
      color: #168d91;
    }
    nav a {
      padding: 8px 14px;
      border: 1px solid #d9e5e9;
      border-radius: 6px;
      text-decoration: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      padding: 32px 5vw;
    }
    article {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #dbe4e9;
      scroll-margin: 20px;
    }
    article a {
      display: block;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    h2 {
      font-size: 17px;
      margin: 18px 20px;
    }
    footer {
      padding: 0 5vw 30px;
      color: #607486;
    }
    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <header>
    <h1>kingpolymer · UI 升级设计</h1>
    <p>
      7 张页面设计图 · 深蓝与青绿工程风格<br />2.1
      版本已参照设计图完成界面升级。图中业务数据仅用于演示，实际交互以运行项目为准。点击图片查看原图。
    </p>
    <nav>

      ><a href="#05-inventory">库存管理</a><a href="#06-settings">系统设置</a
